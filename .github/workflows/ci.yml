name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile scripts/check_ai.py scripts/selftest.py
      - name: Self-test
        run: python scripts/selftest.py
      - name: Human draft must pass strict gate
        run: python scripts/check_ai.py examples/case-01/human-draft.txt --strict
